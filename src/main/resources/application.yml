server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30d
      cookie:
        name: SILVERCARE_SESSION
        http-only: true
        max-age: 2592000
        same-site: lax

spring:
  application:
    name: silvercare
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/silvercare}
    username: ${DB_USER:silvercare}
    password: ${DB_PASSWORD:silvercare_local}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:unset}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

logging:
  level:
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO

silvercare:
  demo-login: ${DEMO_LOGIN:false}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}

jwt:
  secret: ${JWT_SECRET:}
  cookie-name: SILVERCARE_TOKEN
  ttl-days: 30
