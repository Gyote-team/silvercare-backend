services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: silvercare
      POSTGRES_USER: silvercare
      POSTGRES_PASSWORD: silvercare_local
    volumes:
      - silvercare-pg:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silvercare -d silvercare"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  silvercare-pg:
